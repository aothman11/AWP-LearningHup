<style>
/* ── Ease Health Tokens ───────────────────────────────────────────────── */
:root {
  --cream:    #F7F5F0;
  --parchment:#EDE9E1;
  --mist:     #D9D4C8;
  --forest:   #1C3A2B;
  --sage:     #4E7862;
  --fern:     #3D6B52;
  --keylime:  #E8F0E4;
  --mint:     #C8DFC5;
  --slate:    #6B7A6F;
  --ink:      #2A2E2B;
  --paper:    #FAFAF8;

  --radius-card: 14px;
  --radius-pill: 999px;
  --radius-sm:   8px;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'Inter', system-ui, sans-serif;
}

/* ── Reset ────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
button { cursor: pointer; font-family: inherit; }
input  { font-family: inherit; }

/* ── Layout Shell ─────────────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-rows: 58px 1fr;
  grid-template-columns: 232px 1fr;
  grid-template-areas:
    "header header"
    "sidebar main";
  height: 100vh;
  overflow: hidden;
}

/* ── Header ───────────────────────────────────────────────────────────── */
#header {
  grid-area: header;
  background: var(--paper);
  border-bottom: 1px solid var(--mist);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  z-index: 50;
}
.logo {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 20px;
  color: var(--forest);
  letter-spacing: 0.03em;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo span { color: var(--sage); }
.search-wrap {
  flex: 1;
  max-width: 480px;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--slate);
  pointer-events: none;
}
#search {
  width: 100%;
  padding: 8px 36px 8px 36px;
  border: 1px solid var(--mist);
  border-radius: var(--radius-pill);
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color 180ms;
}
#search:focus { border-color: var(--sage); }
#search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--slate);
  font-size: 18px;
  line-height: 1;
  display: none;
  padding: 2px 4px;
}
#search-clear.visible { display: block; }
.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
#result-count {
  font-size: 12px;
  color: var(--slate);
  white-space: nowrap;
}
.sort-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sort-wrap label { font-size: 12px; color: var(--slate); }
#sort-select {
  border: 1px solid var(--mist);
  background: var(--cream);
  color: var(--ink);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: var(--radius-pill);
  outline: none;
}

/* ── Sidebar ──────────────────────────────────────────────────────────── */
#sidebar {
  grid-area: sidebar;
  background: var(--paper);
  border-right: 1px solid var(--mist);
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.filter-group { display: flex; flex-direction: column; gap: 8px; }
.filter-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slate);
  font-weight: 600;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--mist);
}

/* Module pills */
.module-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.module-pill {
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--mist);
  background: transparent;
  color: var(--slate);
  transition: all 140ms;
}
.module-pill:hover { border-color: var(--sage); color: var(--forest); }
.module-pill.active { background: var(--forest); color: var(--cream); border-color: var(--forest); }
.module-pill[data-module="QM"].active { background: var(--sage); color: var(--cream); border-color: var(--sage); }
.module-pill[data-module="PP/QM"].active { background: var(--mint); color: var(--forest); border-color: var(--fern); }

/* Checkbox filters */
.check-list { display: flex; flex-direction: column; gap: 6px; }
.check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check-item input[type="checkbox"] { accent-color: var(--sage); cursor: pointer; }
.check-item span { font-size: 13px; color: var(--ink); }
.check-item:hover span { color: var(--forest); }

/* Role filter */
.role-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.role-pill {
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--mist);
  background: transparent;
  color: var(--slate);
  transition: all 140ms;
}
.role-pill:hover { border-color: var(--fern); color: var(--forest); }
.role-pill.active { background: var(--keylime); color: var(--forest); border-color: var(--sage); }

/* Sidebar stats */
.sidebar-stat {
  background: var(--keylime);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; }
.stat-label { font-size: 11px; color: var(--slate); }
.stat-num { font-family: var(--font-display); font-size: 18px; font-weight: 300; color: var(--forest); }

/* ── Main Content ─────────────────────────────────────────────────────── */
#main {
  grid-area: main;
  overflow-y: auto;
  padding: 24px;
}
#cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--slate);
}
.no-results p { font-size: 14px; margin-top: 8px; }

/* ── Entry Card ───────────────────────────────────────────────────────── */
.card {
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: var(--radius-card);
  padding: 20px;
  cursor: pointer;
  transition: background 160ms, border-color 160ms;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card:hover { background: var(--keylime); border-color: var(--sage); }
.card:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.module-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.badge-PP   { background: var(--forest); color: var(--cream); }
.badge-QM   { background: var(--sage);   color: var(--cream); }
.badge-PPQM { background: var(--mint);   color: var(--forest); }

.relevance-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.dot-High   { background: #4E9E6A; }
.dot-Medium { background: #C49A1A; }
.dot-Low    { background: var(--mist); }
.dot-NotUsed { background: #E07070; }

.card-tcode {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 30px;
  color: var(--forest);
  line-height: 1;
  letter-spacing: 0.01em;
}
.card-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.4;
}
.card-title-ar {
  font-size: 12px;
  color: var(--slate);
  text-align: right;
  line-height: 1.5;
  font-family: 'Sakkal Majalla', 'Arial Unicode MS', serif;
}
.card-desc {
  font-size: 12px;
  color: var(--slate);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}
.category-tag {
  font-size: 10px;
  color: var(--sage);
  background: var(--keylime);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  letter-spacing: 0.03em;
}
.role-tag {
  font-size: 10px;
  color: var(--slate);
  border: 1px solid var(--mist);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
}

/* ── Drawer ───────────────────────────────────────────────────────────── */
#drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28, 58, 43, 0.18);
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms;
}
#drawer-overlay.open { opacity: 1; pointer-events: auto; }

#drawer {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 520px;
  max-width: 100vw;
  background: var(--cream);
  border-left: 1px solid var(--mist);
  z-index: 100;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
}
#drawer.open { transform: translateX(0); }

.drawer-header {
  background: var(--keylime);
  border-bottom: 1px solid var(--mint);
  padding: 24px 28px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.drawer-close {
  position: absolute;
  top: 18px; right: 20px;
  background: none;
  border: 1px solid var(--mist);
  border-radius: var(--radius-pill);
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--slate);
  font-size: 18px;
  transition: all 140ms;
}
.drawer-close:hover { background: var(--mint); color: var(--forest); border-color: var(--sage); }

.drawer-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.drawer-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  letter-spacing: 0.06em;
}
.drawer-badge-category {
  background: var(--paper);
  color: var(--slate);
  border: 1px solid var(--mist);
}
.drawer-badge-relevance-High   { background: #D4EFE0; color: #2A6A42; }
.drawer-badge-relevance-Medium { background: #F8EBC5; color: #7A5E0A; }
.drawer-badge-relevance-Low    { background: var(--parchment); color: var(--slate); }
.drawer-badge-relevance-NotUsed { background: #FCDEDE; color: #9B3030; }
.drawer-badge-role { background: var(--mint); color: var(--forest); }

.drawer-tcode {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 48px;
  color: var(--forest);
  line-height: 1;
  letter-spacing: 0.01em;
}
.drawer-title {
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
  margin-top: 6px;
  line-height: 1.4;
}
.drawer-title-ar {
  font-size: 15px;
  color: var(--slate);
  text-align: right;
  margin-top: 4px;
  font-family: 'Sakkal Majalla', 'Arial Unicode MS', serif;
  direction: rtl;
}

.drawer-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

.drawer-section-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slate);
  font-weight: 600;
  margin-bottom: 8px;
}
.drawer-desc {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.7;
}

/* Integration Flow */
.flow-wrap {
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: var(--radius-card);
  padding: 18px;
}
.flow-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  gap: 8px;
  align-items: start;
}
.flow-col { display: flex; flex-direction: column; gap: 6px; }
.flow-col-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--slate);
  text-align: center;
  margin-bottom: 4px;
}
.flow-item {
  background: var(--keylime);
  border: 1px solid var(--mint);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--forest);
  font-weight: 500;
  text-align: center;
}
.flow-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60px;
}
.flow-tcode-node {
  background: var(--forest);
  color: var(--cream);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 300;
  text-align: center;
  white-space: nowrap;
}
.flow-arrow {
  color: var(--sage);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: center;
  padding-top: 20px;
}
.flow-produces .flow-item {
  background: var(--mint);
  border-color: var(--sage);
}

/* Related + Tags */
.related-grid { display: flex; flex-direction: column; gap: 6px; }
.related-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 140ms;
  text-align: left;
  width: 100%;
}
.related-item:hover { background: var(--keylime); border-color: var(--sage); }
.related-tcode { font-family: var(--font-display); font-size: 16px; font-weight: 300; color: var(--forest); flex-shrink: 0; }
.related-title { font-size: 12px; color: var(--ink); line-height: 1.3; }

.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill {
  font-size: 11px;
  color: var(--sage);
  background: var(--keylime);
  border: 1px solid var(--mint);
  border-radius: var(--radius-pill);
  padding: 3px 10px;
  cursor: pointer;
  transition: all 140ms;
}
.tag-pill:hover { background: var(--mint); color: var(--forest); }

.drawer-meta {
  font-size: 11px;
  color: var(--mist);
  border-top: 1px solid var(--mist);
  padding-top: 12px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.drawer-meta a { color: var(--sage); text-decoration: none; }
.drawer-meta a:hover { text-decoration: underline; }
.doc-pending { color: #C49A1A; font-size: 11px; }

/* Copy button */
.copy-btn {
  background: none;
  border: 1px solid var(--mist);
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  font-size: 11px;
  color: var(--slate);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 140ms;
  margin-top: 4px;
}
.copy-btn:hover { background: var(--keylime); border-color: var(--sage); color: var(--forest); }

/* Notes */
.notes-area {
  width: 100%;
  min-height: 80px;
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 140ms;
}
.notes-area:focus { border-color: var(--sage); }
.notes-area::placeholder { color: var(--mist); }

/* Sidebar scrollbar */
#sidebar::-webkit-scrollbar,
#main::-webkit-scrollbar,
#drawer::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track,
#main::-webkit-scrollbar-track,
#drawer::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb,
#main::-webkit-scrollbar-thumb,
#drawer::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 99px; }
</style>

/* ── State ─────────────────────────────────────────────────────────────── */
let state = {
  query: "",
  module: "ALL",
  relevances: new Set(["High","Medium","Low","Not Used"]),
  categories: new Set(),
  role: "ALL",
  sort: "relevance",
  openEntry: null,
};

/* ── Utilities ─────────────────────────────────────────────────────────── */
const badgeClass = m => m === "PP" ? "badge-PP" : m === "QM" ? "badge-QM" : "badge-PPQM";
const badgeLbl   = m => m === "PP/QM" ? "PP/QM" : m;
const dotClass   = r => "dot-" + r.replace(/\s/g,"");
const relevanceOrder = {High:0, Medium:1, Low:2, "Not Used":3};

function allCategories() {
  const s = new Set();
  entries.forEach(e => s.add(e.category));
  return [...s].sort();
}

function filtered() {
  const q = state.query.toLowerCase();
  return entries.filter(e => {
    if (state.module !== "ALL" && e.module !== state.module) return false;
    if (!state.relevances.has(e.awpRelevance)) return false;
    if (state.categories.size > 0 && !state.categories.has(e.category)) return false;
    if (state.role !== "ALL" && e.role !== state.role) return false;
    if (!q) return true;
    return [e.transactionCode, e.title, e.titleAr, e.description, e.category, e.processArea,
            e.notes, ...(e.tags||[]), ...(e.relatedTransactions||[]),
            ...(e.triggers||[]), ...(e.produces||[])].some(v => v && v.toLowerCase().includes(q));
  }).sort((a, b) => {
    if (state.sort === "relevance") return relevanceOrder[a.awpRelevance] - relevanceOrder[b.awpRelevance];
    if (state.sort === "tcode") return a.transactionCode.localeCompare(b.transactionCode);
    if (state.sort === "module") return a.module.localeCompare(b.module);
    if (state.sort === "category") return a.category.localeCompare(b.category);
    return 0;
  });
}

/* ── Render Cards ──────────────────────────────────────────────────────── */
function renderCards() {
  const list = filtered();
  const grid = document.getElementById("cards");
  document.getElementById("result-count").textContent = `${list.length} of ${entries.length} entries`;

  if (!list.length) {
    grid.innerHTML = `<div class="no-results">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--mist)" stroke-width="1.2">
        <circle cx="11" cy="11" r="7"/><path d="m15 15 5 5"/>
      </svg>
      <p>No T-codes match your filters.<br>Try broadening your search.</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(e => `
    <div class="card" data-id="${e.id}" tabindex="0" role="button" aria-label="${e.transactionCode}: ${e.title}">
      <div class="card-top">
        <span class="module-badge ${badgeClass(e.module)}">${badgeLbl(e.module)}</span>
        <div class="relevance-dot ${dotClass(e.awpRelevance)}" title="AWP: ${e.awpRelevance}"></div>
      </div>
      <div class="card-tcode">${e.transactionCode}</div>
      <div class="card-title">${e.title}</div>
      ${e.titleAr ? `<div class="card-title-ar">${e.titleAr}</div>` : ""}
      <div class="card-desc">${e.description}</div>
      <div class="card-footer">
        <span class="category-tag">${e.category}</span>
        <span class="role-tag">${e.role}</span>
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    const open = () => { const id = card.dataset.id; openDrawer(entries.find(e => e.id === id)); };
    card.addEventListener("click", open);
    card.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } });
  });
}

/* ── Render Sidebar Categories ─────────────────────────────────────────── */
function renderCategoryList() {
  const cats = allCategories();
  const list = document.getElementById("category-list");
  list.innerHTML = cats.map(c => `
    <label class="check-item">
      <input type="checkbox" data-category="${c}">
      <span>${c}</span>
    </label>
  `).join("");
  list.querySelectorAll("input").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) state.categories.add(cb.dataset.category);
      else state.categories.delete(cb.dataset.category);
      renderCards();
    });
  });
}

/* ── Stats ─────────────────────────────────────────────────────────────── */
function renderStats() {
  document.getElementById("stat-pp").textContent   = entries.filter(e => e.module === "PP").length;
  document.getElementById("stat-qm").textContent   = entries.filter(e => e.module === "QM").length;
  document.getElementById("stat-ppqm").textContent = entries.filter(e => e.module === "PP/QM").length;
}

/* ── Drawer ────────────────────────────────────────────────────────────── */
function openDrawer(entry) {
  if (!entry) return;
  state.openEntry = entry;
  const overlay = document.getElementById("drawer-overlay");
  const drawer  = document.getElementById("drawer");

  // Header
  document.getElementById("drawer-tcode").textContent = entry.transactionCode;
  document.getElementById("drawer-title").textContent = entry.title;
  document.getElementById("drawer-title-ar").textContent = entry.titleAr || "";

  const badgesEl = document.getElementById("drawer-badges");
  badgesEl.innerHTML = `
    <span class="drawer-badge ${badgeClass(entry.module)}" style="font-size:11px;padding:3px 10px">${entry.module}</span>
    <span class="drawer-badge drawer-badge-category">${entry.category}</span>
    <span class="drawer-badge drawer-badge-relevance-${entry.awpRelevance.replace(/\s/g,"")}">AWP: ${entry.awpRelevance}</span>
    <span class="drawer-badge drawer-badge-role">${entry.role}</span>
  `;

  // Body
  const related = (entry.relatedTransactions || [])
    .map(tc => entries.find(e => e.transactionCode === tc || e.transactionCode.includes(tc)))
    .filter(Boolean);

  const hasUrl = Boolean(entry.sapDocUrl);

  document.getElementById("drawer-body").innerHTML = `
    <!-- Description -->
    <div>
      <div class="drawer-section-label">Description</div>
      <p class="drawer-desc">${entry.description}</p>
      <button class="copy-btn" id="copy-tcode">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="4" width="9" height="9" rx="1.5"/><path d="M3 11H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1"/>
        </svg>
        Copy T-Code
      </button>
    </div>

    <!-- Integration Flow -->
    <div>
      <div class="drawer-section-label">Integration Flow</div>
      <div class="flow-wrap">
        <div class="flow-grid">
          <div class="flow-col">
            <div class="flow-col-label">Triggers</div>
            ${(entry.triggers||[]).map(t => `<div class="flow-item">${t}</div>`).join("") || `<div class="flow-item" style="color:var(--slate)">—</div>`}
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-center">
            <div class="flow-col-label">T-Code</div>
            <div class="flow-tcode-node">${entry.transactionCode}</div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-col flow-produces">
            <div class="flow-col-label">Produces</div>
            ${(entry.produces||[]).map(p => `<div class="flow-item">${p}</div>`).join("") || `<div class="flow-item" style="color:var(--slate)">—</div>`}
          </div>
        </div>
      </div>
    </div>

    <!-- Process Area -->
    <div>
      <div class="drawer-section-label">Process Area</div>
      <p class="drawer-desc" style="font-size:13px">${entry.processArea}</p>
    </div>

    ${entry.notes ? `
    <!-- AWP Notes -->
    <div>
      <div class="drawer-section-label">AWP Notes</div>
      <p class="drawer-desc" style="font-size:13px;color:var(--sage);font-style:italic">${entry.notes}</p>
    </div>` : ""}

    ${related.length ? `
    <!-- Related -->
    <div>
      <div class="drawer-section-label">Related T-Codes</div>
      <div class="related-grid">
        ${related.map(r => `
          <button class="related-item" data-id="${r.id}">
            <span class="related-tcode">${r.transactionCode}</span>
            <span class="related-title">${r.title}</span>
          </button>
        `).join("")}
      </div>
    </div>` : ""}

    ${entry.tags.length ? `
    <!-- Tags -->
    <div>
      <div class="drawer-section-label">Tags</div>
      <div class="tags-wrap">
        ${entry.tags.map(t => `<span class="tag-pill" data-tag="${t}">#${t}</span>`).join("")}
      </div>
    </div>` : ""}

    <!-- Meta -->
    <div class="drawer-meta">
      <span>ID: ${entry.id}</span>
      ${hasUrl
        ? `<a href="${entry.sapDocUrl}" target="_blank" rel="noopener">SAP Help ↗</a>`
        : `<span class="doc-pending">⚠ Doc link pending</span>`}
      <span>Verified: ${entry.lastVerified}</span>
    </div>
  `;

  // Wire up related buttons
  document.getElementById("drawer-body").querySelectorAll(".related-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const rel = entries.find(e => e.id === btn.dataset.id);
      if (rel) openDrawer(rel);
    });
  });

  // Tag pills — search on click
  document.getElementById("drawer-body").querySelectorAll(".tag-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      const tag = pill.dataset.tag;
      document.getElementById("search").value = tag;
      state.query = tag;
      document.getElementById("search-clear").classList.add("visible");
      renderCards();
      closeDrawer();
    });
  });

  // Copy T-code
  document.getElementById("copy-tcode").addEventListener("click", () => {
    navigator.clipboard.writeText(entry.transactionCode).catch(() => {});
    const btn = document.getElementById("copy-tcode");
    btn.textContent = "Copied!";
    setTimeout(() => {
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="9" height="9" rx="1.5"/><path d="M3 11H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1"/></svg> Copy T-Code`;
    }, 1500);
  });

  overlay.classList.add("open");
  drawer.classList.add("open");
  drawer.focus();
}

function closeDrawer() {
  document.getElementById("drawer-overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
  state.openEntry = null;
}

/* ── Wiring ─────────────────────────────────────────────────────────────── */
// Search
const searchEl = document.getElementById("search");
const clearBtn = document.getElementById("search-clear");
searchEl.addEventListener("input", () => {
  state.query = searchEl.value;
  clearBtn.classList.toggle("visible", !!state.query);
  renderCards();
});
clearBtn.addEventListener("click", () => {
  searchEl.value = "";
  state.query = "";
  clearBtn.classList.remove("visible");
  renderCards();
});

// Sort
document.getElementById("sort-select").addEventListener("change", e => {
  state.sort = e.target.value;
  renderCards();
});

// Module pills
document.querySelectorAll(".module-pill").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".module-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    state.module = pill.dataset.module;
    renderCards();
  });
});

// Relevance checkboxes
document.querySelectorAll("[data-relevance]").forEach(cb => {
  cb.addEventListener("change", () => {
    if (cb.checked) state.relevances.add(cb.dataset.relevance);
    else state.relevances.delete(cb.dataset.relevance);
    renderCards();
  });
});

// Role pills
document.querySelectorAll(".role-pill").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".role-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    state.role = pill.dataset.role;
    renderCards();
  });
});

// Drawer close
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ── Init ───────────────────────────────────────────────────────────────── */
renderCategoryList();
renderStats();
renderCards();
</script>
